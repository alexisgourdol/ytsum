[project]
name = "youtube-summarizer"
version = "0.2.0"
description = "Download and summarize YouTube video transcripts using AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=0.6.0",
    "pydantic-ai-slim>=2.0.0",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]"]
openai = ["pydantic-ai-slim[openai]"]
gemini = ["pydantic-ai-slim[google]"]
trace = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "openinference-instrumentation-pydantic-ai",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "youtube-summarizer[trace]",
]

[project.scripts]
youtube-summarizer = "youtube_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests",
]
